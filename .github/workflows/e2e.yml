name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  POSTGRES_PASSWORD: postgres

jobs:
  setup:
    name: Setup — emit deterministic anon key + cache Supabase images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      anon-key: ${{ steps.emit-key.outputs.anon-key }}
      supabase-host: ${{ steps.supabase-host.outputs.host }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull & cache Supabase images
        id: supabase-images
        run: |
          # Supabase local stack images (pinned to versions used by supabase@2.119.0)
          IMAGES=(
            "postgres:15-alpine"
            "kong:2.8.1"
            "supabase/gotrue:v2.151.0"
            "supabase/postgrest:v11.2.0"
            "supabase/realtime:v2.33.8"
            "supabase/storage-api:v1.11.4"
            "supabase/studio:20240115-5c5c5c5"
            "supabase/imgproxy:v3.6.0"
            "supabase/postgres-meta:v0.71.0"
            "supabase/logflare:1.4.0"
          )
          for img in "${IMAGES[@]}"; do
            echo "Pulling $img..."
            docker pull "$img" || echo "Warning: failed to pull $img (may already exist)"
          done
          echo "Supabase images pulled."

      - name: Cache Supabase Docker layers
        uses: actions/cache@v4
        with:
          path: /var/lib/docker
          key: supabase-images-${{ hashFiles('pnpm-lock.yaml') }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            supabase-images-${{ hashFiles('pnpm-lock.yaml') }}-${{ runner.os }}-
            supabase-images-

      - name: Install Supabase CLI
        run: |
          # Install supabase CLI globally (pinned to version in package.json)
          npm install -g supabase@2.119.0
          supabase --version

      - name: Start Supabase stack (shared for all browser jobs)
        id: supabase-start
        run: |
          # Start Supabase in background, capture container network
          supabase start --host-only
          # The local stack binds to 127.0.0.1:54321 on the host
          # For CI containers, we need the Docker host IP
          HOST_IP=$(ip route | awk '/default/ {print $3}')
          echo "host=$HOST_IP" >> $GITHUB_OUTPUT

      - name: Wait for Supabase health
        run: |
          API_BASE="http://${{ steps.supabase-start.outputs.host }}:54321"
          for i in {1..90}; do
            if curl -sf "$API_BASE/auth/v1/health" >/dev/null && curl -sf "$API_BASE/rest/v1/" >/dev/null; then
              echo "Supabase healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Supabase health check failed"
          exit 1

      - name: Reset database
        run: supabase db reset
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Emit deterministic anon key
        id: emit-key
        run: |
          # Local Supabase uses a fixed JWT secret, so the anon key is always:
          echo "anon-key=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" >> $GITHUB_OUTPUT

      - name: Export Supabase host for browser jobs
        id: supabase-host
        run: echo "host=${{ steps.supabase-start.outputs.host }}" >> $GITHUB_OUTPUT

  e2e-chromium:
    name: E2E Chromium
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (Chromium)
        run: pnpm test:e2e:ci --project=chromium
        env:
          VITE_SUPABASE_URL: http://${{ needs.setup.outputs.supabase-host }}:54321
          VITE_SUPABASE_ANON_KEY: ${{ needs.setup.outputs.anon-key }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium
          path: test-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-chromium
          path: test-results/**/trace.zip
          retention-days: 7

  e2e-firefox:
    name: E2E Firefox
    needs: [setup, e2e-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps firefox

      - name: Run E2E tests (Firefox)
        run: pnpm test:e2e:ci --project=firefox
        env:
          VITE_SUPABASE_URL: http://${{ needs.setup.outputs.supabase-host }}:54321
          VITE_SUPABASE_ANON_KEY: ${{ needs.setup.outputs.anon-key }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-firefox
          path: playwright-report
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-firefox
          path: test-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-firefox
          path: test-results/**/trace.zip
          retention-days: 7

  e2e-webkit:
    name: E2E WebKit
    needs: [setup, e2e-firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: Run E2E tests (WebKit)
        run: pnpm test:e2e:ci --project=webkit
        env:
          VITE_SUPABASE_URL: http://${{ needs.setup.outputs.supabase-host }}:54321
          VITE_SUPABASE_ANON_KEY: ${{ needs.setup.outputs.anon-key }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-webkit
          path: test-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-webkit
          path: test-results/**/trace.zip
          retention-days: 7