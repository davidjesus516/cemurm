name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  POSTGRES_PASSWORD: postgres

jobs:
  setup:
    name: Setup Supabase & Dev Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      anon-key: ${{ steps.extract-keys.outputs.anon-key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Start Supabase stack
        run: npx supabase start

      - name: Wait for Supabase health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:54321/health > /dev/null; then
              echo "Supabase is healthy"
              exit 0
            fi
            echo "Waiting for Supabase... ($i/30)"
            sleep 2
          done
          echo "Supabase failed to become healthy"
          exit 1

      - name: Run database migrations and seed
        run: npx supabase db reset

      - name: Extract anon key
        id: extract-keys
        run: |
          ANON_KEY=$(npx supabase status --output json 2>/dev/null | jq -r '.services[] | select(.name=="API") | .anon_key')
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "Failed to extract anon key"
            exit 1
          fi
          echo "anon-key=$ANON_KEY" >> $GITHUB_OUTPUT

      - name: Start Vite dev server
        run: |
          nohup pnpm dev > vite.log 2>&1 &
          echo $! > vite.pid
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ steps.extract-keys.outputs.anon-key }}

      - name: Wait for Vite dev server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Vite dev server is ready"
              exit 0
            fi
            echo "Waiting for Vite... ($i/30)"
            sleep 2
          done
          echo "Vite dev server failed to start"
          cat vite.log
          exit 1

  e2e-chromium:
    name: E2E Chromium
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
