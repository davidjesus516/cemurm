            if curl -sf http://localhost:54321/health > /dev/null; then
              echo "Supabase is healthy"
              exit 0
            fi
            echo "Waiting for Supabase... ($i/30)"
            sleep 2
          done
          echo "Supabase failed to become healthy"
          exit 1

      - name: Run database migrations and seed
        run: npx supabase db reset

      - name: Start Vite dev server
        run: |
          nohup pnpm dev > vite.log 2>&1 &
          echo $! > vite.pid
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ needs.setup.outputs.anon-key }}

      - name: Wait for Vite dev server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Vite dev server is ready"
              exit 0
            fi
            echo "Waiting for Vite... ($i/30)"
            sleep 2
          done
          echo "Vite dev server failed to start"
          cat vite.log
          exit 1

      - name: Run E2E tests (Chromium)
        run: pnpm test:e2e:ci --project=chromium
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ needs.setup.outputs.anon-key }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium
          path: test-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-chromium
          path: test-results/**/trace.zip
          retention-days: 7

