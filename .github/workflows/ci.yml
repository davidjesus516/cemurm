name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Visual contract gate. Bash + grep only, so it needs no install step, and
      # it deliberately sits after lint and before test. pnpm typecheck is NOT
      # wired in here on purpose; see "Type checking is per-file opt-in" in
      # AGENTS.md.
      - run: bash scripts/check-visual-contract.sh

      - run: pnpm test

      - run: pnpm test:gherkin

      - run: pnpm build
