name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by declaration, not by inheritance. The repository default happens to be
# read-only today, but that is a setting somebody can flip without a diff, a review
# or a test noticing. Every job below only checks out code and installs public
# packages, so `contents: read` is the whole of what this workflow needs.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Edge function type-check. `supabase/functions/` is outside every other
      # gate: `.eslintrc.cjs` ignores `supabase/` (these functions target Deno),
      # and `tsconfig.json` has no supabase path. The glob is QUOTED on purpose —
      # unquoted, bash expands `**` as `*` (globstar is off in Actions) and
      # silently omits nested files; quoted, Deno expands it recursively.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check 'supabase/functions/**/*.ts'

      # Type check. It runs here, after lint and before the gates, because the
      # visual gate below exits 1 under `set -euo pipefail`: anything placed
      # after it is marked SKIPPED, and a reviewer cannot tell a real downstream
      # failure from a check that never ran. That is why the gate itself runs
      # LAST rather than here.
      - run: pnpm typecheck

      # ADR-006 with machine teeth. `.only`, `.skip` and `.todo` are not a
      # failing run, they are a green run that tested less, so nothing in the
      # suite could see them. Bash + grep only, same as the visual gate.
      - run: bash scripts/check-test-integrity.sh

      # The ACL gate's own verdict logic, with `docker` stubbed: passes/fails, exit
      # codes, the ratchet, the findings cap and every fail-closed setup path. The
      # gate itself needs a live catalog and runs in e2e.yml; without this, a gate
      # that silently always passed would look exactly like a gate that works.
      - run: bash scripts/check-table-privileges.test.sh

      # The agent guard is a policy, and a policy nobody verifies decays the same
      # way `.only` did. This asserts the rules themselves: DROP/TRUNCATE blocked,
      # `supabase db reset` still allowed, generated artifacts excluded from the
      # PR budget, exit 2 on a block and 0 otherwise.
      - run: node scripts/hooks/pre-tool-guard.selftest.mjs

      - run: pnpm test

      - run: pnpm test:gherkin

      - run: pnpm build

      # Migration version uniqueness. Filenames only -- no database, no network,
      # no install. Two files sharing a version prefix abort `supabase db reset`
      # (and `supabase start`) with a duplicate-key error, which takes down E2E
      # and the whole scripts/smoke/ suite; nothing else in the repository could
      # see it, because it appears only in a database on a machine that was
      # actually reset. Placed here rather than before test and build for the
      # same reason as the visual gate below: a gate that precedes them exits 1
      # under `set -euo pipefail`, which marks test and build SKIPPED, and a
      # reviewer cannot tell a real downstream failure from a check that never
      # ran.
      - run: bash scripts/check-migrations-unique.sh

      # Destructive SQL in migrations. The Claude Code PreToolUse hook blocks
      # the Write/Edit that introduces a DROP or TRUNCATE; this scans the files
      # themselves, so the same rule holds for runtimes whose permission hook
      # only sees the path (OpenCode), for a human writing SQL directly, and
      # for anything else that never met a hook. No database, no network --
      # same rule (judgeMigrationContent from scripts/hooks/rules.mjs) and same
      # escape hatch (-- destructive-ok) as the hook. Here rather than before
      # test and build for the same reason as the two gates above: it can exit
      # 1, and a failing step under set -euo pipefail marks everything after
      # it SKIPPED.
      - run: node scripts/check-migrations-destructive.mjs

      # Counts stated in AGENTS.md and docs/master-plan.md, checked against the
      # tree. Those files tell the next agent how many migrations exist and
      # which number is free; the numbers have been wrong every time anyone
      # re-counted them, five times in AGENTS.md alone. Correcting a number is a
      # PR's work; this is what stops the next drift. Bash + grep only, and here
      # for the same set -euo pipefail reason as the gates around it.
      - run: bash scripts/check-doc-counts.sh

      # Visual contract gate. Bash + grep only, so it needs no install step, and
      # it deliberately runs LAST rather than before test and build: a gate that
      # precedes them exits 1 under set -euo pipefail, which marks test and
      # build SKIPPED, and a reviewer cannot tell a real downstream failure from
      # a check that never ran. Run after them, its FAIL lines sit next to a
      # known-green test and build instead of hiding them.
      - run: bash scripts/check-visual-contract.sh
