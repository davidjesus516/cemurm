name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Install Deno for edge function type-checking (supabase/functions/)
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm lint

      # Edge function type-check: catches import/export, TS syntax, and config
      # issues in supabase/functions/** before they reach deploy.
      - run: deno check supabase/functions/**/*.ts

      # Type check sits BEFORE the visual gate, not after it. The gate exits 1
      # on its first failing ratchet and is red on pristine main, which aborts
      # the job: anything placed after it is silently skipped, which is how test
      # and build have been reporting "skipped" instead of running.
      - run: pnpm typecheck

      # Visual contract gate. Bash + grep only, so it needs no install step, and
      # it deliberately sits after lint and before test.
      - run: bash scripts/check-visual-contract.sh

      - run: pnpm test

      - run: pnpm test:gherkin

      - run: pnpm build
