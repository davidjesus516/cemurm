name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type checking is per-file opt-in: tsconfig.json has allowJs with global
      # checkJs OFF, so `tsc --noEmit` only checks the files that carry a
      # `// @ts-check` pragma -- today the domain, data/repository,
      # integrations and offline layers. src/features is deliberately NOT in the
      # tsconfig `include` yet, so no UI .jsx is type-checked here; widening it
      # is tracked separately. It runs before lint because a type error is a more
      # precise report than a lint failure on the same line.
      - run: pnpm typecheck

      - run: pnpm lint

      # ADR-006 with machine teeth. `.only`, `.skip` and `.todo` are not a
      # failing run, they are a green run that tested less, so nothing in the
      # suite could see them. Bash + grep only, same as the visual gate.
      - run: bash scripts/check-test-integrity.sh

      - run: pnpm test

      - run: pnpm test:gherkin

      - run: pnpm build

      # Visual contract gate. Bash + grep only, so it needs no install step, and
      # it deliberately runs LAST rather than before test and build: a gate that
      # precedes them exits 1 under set -euo pipefail, which marks test and
      # build SKIPPED, and a reviewer cannot tell a real downstream failure from
      # a check that never ran. Run after them, its FAIL lines sit next to a
      # known-green test and build instead of hiding them.
      - run: bash scripts/check-visual-contract.sh
