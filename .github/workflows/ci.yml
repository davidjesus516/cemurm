name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Type check. It runs here, after lint and before the gates, because the
      # visual gate below exits 1 under `set -euo pipefail`: anything placed
      # after it is marked SKIPPED, and a reviewer cannot tell a real downstream
      # failure from a check that never ran. That is why the gate itself runs
      # LAST rather than here.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:gherkin

      - run: pnpm build

      # Visual contract gate. Bash + grep only, so it needs no install step, and
      # it deliberately runs LAST rather than before test and build: a gate that
      # precedes them exits 1 under set -euo pipefail, which marks test and
      # build SKIPPED, and a reviewer cannot tell a real downstream failure from
      # a check that never ran. Run after them, its FAIL lines sit next to a
      # known-green test and build instead of hiding them.
      - run: bash scripts/check-visual-contract.sh
