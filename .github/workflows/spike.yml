# Spike Suite Modular — CI Workflow
#
# Qué corre en cada evento (esto es lo que estaba roto: ver la nota de abajo):
#
#   push / pull_request   → `plan` + S2 software (discovery, heartbeat, failover)
#                           + `spike-report` (Gate G2). Es todo lo que un runner
#                           estándar de GitHub puede ejecutar de verdad.
#   workflow_dispatch     → además, lo que se seleccione con `spike`, con
#                           `hardware: true` para los jobs que necesitan
#                           dispositivos o un router con netem.
#
# Los jobs S1/S3 y los de dispositivo siguen existiendo, pero **no** pretenden
# correr en un runner alojado: S1 necesita hardware real (iOS/Android/Windows/
# macOS), S2-netem necesita un linux-router con `tc`, y S3 necesita el toolchain
# de emscripten y un Verovio nativo compilado. Se seleccionan a mano.
#
# Nota histórica: antes cada job llevaba
#   if: github.event.inputs.spike == 'all' || ... == 'S1'
# y `github.event.inputs` está vacío fuera de `workflow_dispatch`, así que en
# push/PR **todos** los jobs se saltaban — incluido el informe G2, que por eso
# nunca llegó a ejecutarse en una PR. El job `plan` existe para evaluar la
# selección una sola vez y publicarla como output, que sí es legible desde el
# `if` de cualquier otro job.
#
# Self-hosted runners esperados por los jobs manuales: spike-ios, spike-android,
# spike-windows, spike-macos, spike-linux-router.
# Artifacts → spike/results/ (retención 90 días)

name: Spike Suite Modular

on:
  push:
    branches: [spike/suite-modular]
  pull_request:
    branches: [spike/suite-modular]
  workflow_dispatch:
    inputs:
      spike:
        description: 'Spike a ejecutar (S1, S2, S3, all)'
        required: true
        default: 'all'
        type: choice
        options: [S1, S2, S3, all]
      device:
        description: 'Dispositivo objetivo'
        required: false
        default: 'all'
        type: choice
        options: [ios, android, windows, all]
      hardware:
        description: 'Ejecutar también los jobs que requieren hardware self-hosted'
        required: false
        default: false
        type: boolean
      provision:
        description: 'Provisionar el hardware de prueba (Ansible) en vez de medir'
        required: false
        default: false
        type: boolean

env:
  SPIKE_ROOT: ${{ github.workspace }}/spike
  RESULTS_DIR: ${{ github.workspace }}/spike/results
  ARTIFACT_RETENTION_DAYS: 90

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Plan — qué se puede ejecutar en este evento
  # ─────────────────────────────────────────────────────────────────
  plan:
    name: Plan — selección de spike
    runs-on: ubuntu-latest
    outputs:
      spike: ${{ steps.pick.outputs.spike }}
      hardware: ${{ steps.pick.outputs.hardware }}
    steps:
      - id: pick
        name: Resolve target
        run: |
          # En push/pull_request no hay inputs: el default es 'all' sin hardware.
          echo "spike=${{ github.event.inputs.spike || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "hardware=${{ github.event.inputs.hardware || 'false' }}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # S1 — Audio Core (Capa 2A) — requiere hardware
  # ─────────────────────────────────────────────────────────────────
  s1-build:
    name: S1 Build — ${{ matrix.platform }}
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S1')"
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: spike-ios
            build_script: ./build_ios.sh
            artifact_name: oboe-rhythmgame-ios
          - platform: android
            runner: spike-android
            build_script: ./build_android.sh
            artifact_name: oboe-rhythmgame-android
          - platform: windows
            runner: spike-windows
            build_script: ./build_windows.ps1
            artifact_name: oboe-rhythmgame-windows
          - platform: macos
            runner: spike-macos
            build_script: ./build_macos.sh
            artifact_name: oboe-rhythmgame-macos
    steps:
      - uses: actions/checkout@v4
      - name: Setup build env
        run: |
          cd ${{ env.SPIKE_ROOT }}/audio-core
          chmod +x *.sh *.ps1 2>/dev/null || true
      - name: Build oboe RhythmGame example
        run: ${{ matrix.build_script }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.SPIKE_ROOT }}/audio-core/build/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s1-loopback:
    name: S1 Loopback Test — ${{ matrix.device }}
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S1')"
    needs: [plan, s1-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: ios
            runner: spike-ios
            csv_name: audio-core-latency-ios.csv
          - device: android
            runner: spike-android
            csv_name: audio-core-latency-android.csv
          - device: windows
            runner: spike-windows
            csv_name: audio-core-latency-windows.csv
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: oboe-rhythmgame-${{ matrix.device }}
          path: ${{ env.SPIKE_ROOT }}/audio-core/build/
      - name: Run loopback test (1000 iteraciones)
        run: |
          cd ${{ env.SPIKE_ROOT }}/audio-core
          ./run_loopback_test.sh --device ${{ matrix.device }} --iterations 1000 --output ${{ env.RESULTS_DIR }}/${{ matrix.csv_name }}
      - name: Upload latency CSV
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.csv_name }}
          path: ${{ env.RESULTS_DIR }}/${{ matrix.csv_name }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s1-interruptions:
    name: S1 Interruptions Test — ${{ matrix.device }}
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S1')"
    needs: [plan, s1-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: ios
            runner: spike-ios
            csv_name: audio-interruptions-ios.csv
          - device: android
            runner: spike-android
            csv_name: audio-interruptions-android.csv
          - device: windows
            runner: spike-windows
            csv_name: audio-interruptions-windows.csv
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: oboe-rhythmgame-${{ matrix.device }}
          path: ${{ env.SPIKE_ROOT }}/audio-core/build/
      - name: Run interruption tests (bg/fg, lock, call)
        run: |
          cd ${{ env.SPIKE_ROOT }}/audio-core
          ./run_interruption_tests.sh --device ${{ matrix.device }} --output ${{ env.RESULTS_DIR }}/${{ matrix.csv_name }}
      - name: Upload interruptions CSV
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.csv_name }}
          path: ${{ env.RESULTS_DIR }}/${{ matrix.csv_name }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s1-config-doc:
    name: S1 Platform Config Doc
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S1')"
    needs: [plan, s1-build, s1-loopback, s1-interruptions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all CSVs
        uses: actions/download-artifact@v4
        with:
          pattern: audio-*-*.csv
          path: ${{ env.RESULTS_DIR }}/
      - name: Generate platform config markdown
        run: |
          cd ${{ env.SPIKE_ROOT }}/audio-core
          ./generate_config_doc.sh --results ${{ env.RESULTS_DIR }} --output ${{ env.RESULTS_DIR }}/audio-platform-config.md
      - name: Upload config doc
        uses: actions/upload-artifact@v4
        with:
          name: audio-platform-config.md
          path: ${{ env.RESULTS_DIR }}/audio-platform-config.md
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ─────────────────────────────────────────────────────────────────
  # S2 — P2P Sync (Capa 3A)
  # Los tres primeros son software puro y corren en push/PR; el resto
  # necesita un router con netem o dispositivos reales.
  # ─────────────────────────────────────────────────────────────────
  s2-discovery:
    name: S2 mDNS Discovery
    if: "needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S2'"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run mDNS discovery test (3 nodos)
        # Los scripts toman argumentos POSICIONALES: <nodos> <log>. Pasarlos
        # como --nodes/--output hacía que NODES valiera "--nodes" y `seq`
        # reventara.
        run: |
          cd ${{ env.SPIKE_ROOT }}/p2p-sync
          ./test_discovery.sh 3 "${{ env.RESULTS_DIR }}/p2p-discovery.log"
      - name: Upload discovery log
        uses: actions/upload-artifact@v4
        with:
          name: p2p-discovery.log
          path: ${{ env.RESULTS_DIR }}/p2p-discovery.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s2-heartbeat:
    name: S2 Heartbeat + Clock Sync
    if: "needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S2'"
    needs: [plan, s2-discovery]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas (the script analyzes with it)
        run: pip install pandas
      - name: Run heartbeat test (10 min)
        # El script imprime ❌/✅ pero sale con 0 en ambos casos, así que el
        # veredicto se decide aquí: un job verde tras un ❌ sería un gate que
        # no mide nada.
        run: |
          set -o pipefail
          cd ${{ env.SPIKE_ROOT }}/p2p-sync
          ./test_heartbeat.sh 600 "${{ env.RESULTS_DIR }}/p2p-heartbeat.csv" | tee /tmp/heartbeat.out
          if grep -q '❌' /tmp/heartbeat.out; then
            echo "::error::S2 heartbeat criterion FAILED (see output above)"
            exit 1
          fi
      - name: Upload heartbeat CSV
        uses: actions/upload-artifact@v4
        with:
          name: p2p-heartbeat.csv
          path: ${{ env.RESULTS_DIR }}/p2p-heartbeat.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s2-failover:
    name: S2 Maestro Failover
    if: "needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S2'"
    needs: [plan, s2-heartbeat]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas (the script analyzes with it)
        run: pip install pandas
      - name: Run failover test (kill maestro)
        run: |
          set -o pipefail
          cd ${{ env.SPIKE_ROOT }}/p2p-sync
          ./test_failover.sh "${{ env.RESULTS_DIR }}/p2p-failover.csv" | tee /tmp/failover.out
          if grep -q '❌' /tmp/failover.out; then
            echo "::error::S2 failover criterion FAILED (see output above)"
            exit 1
          fi
      - name: Upload failover CSV
        uses: actions/upload-artifact@v4
        with:
          name: p2p-failover.csv
          path: ${{ env.RESULTS_DIR }}/p2p-failover.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s2-netem:
    name: S2 Netem Chaos (10% loss)
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S2')"
    needs: [plan, s2-heartbeat]
    runs-on: spike-linux-router  # Runner con tc/netem capabilities
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure netem (10% loss, 5ms±2ms)
        run: |
          sudo tc qdisc add dev eth0 root netem loss 10% delay 5ms 2ms distribution normal
      - name: Run heartbeat under chaos (5 min)
        run: |
          cd ${{ env.SPIKE_ROOT }}/p2p-sync
          ./test_heartbeat.sh 300 "${{ env.RESULTS_DIR }}/p2p-netem-10pct-loss.csv"
      - name: Cleanup netem
        if: always()
        run: sudo tc qdisc del dev eth0 root 2>/dev/null || true
      - name: Upload netem CSV
        uses: actions/upload-artifact@v4
        with:
          name: p2p-netem-10pct-loss.csv
          path: ${{ env.RESULTS_DIR }}/p2p-netem-10pct-loss.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s2-roaming:
    name: S2 Wi-Fi Roaming (AP primario → secundario)
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S2')"
    needs: [plan, s2-heartbeat]
    runs-on: [spike-ios, spike-android, spike-windows]  # Requiere hardware real
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [ios, android, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Run roaming test (AP switch)
        run: |
          cd ${{ env.SPIKE_ROOT }}/p2p-sync
          ./test_roaming.sh --device ${{ matrix.device }} --output ${{ env.RESULTS_DIR }}/p2p-roaming-${{ matrix.device }}.csv
      - name: Upload roaming CSV
        uses: actions/upload-artifact@v4
        with:
          name: p2p-roaming-${{ matrix.device }}.csv
          path: ${{ env.RESULTS_DIR }}/p2p-roaming-${{ matrix.device }}.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s2-integration:
    name: S2 Integration S1+S2 (Audio + Sync)
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S2')"
    needs: [plan, s1-loopback, s2-heartbeat, s2-netem, s2-roaming, s2-failover]
    runs-on: [spike-ios, spike-android, spike-windows]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [ios, android, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download S1 build
        uses: actions/download-artifact@v4
        with:
          name: oboe-rhythmgame-${{ matrix.device }}
          path: ${{ env.SPIKE_ROOT }}/audio-core/build/
      - name: Run integration test (audio click + P2P sync bajo caos)
        run: |
          cd ${{ env.SPIKE_ROOT }}/p2p-sync
          ./test_integration_s1_s2.sh --device ${{ matrix.device }} --output ${{ env.RESULTS_DIR }}/integration-s1-s2-${{ matrix.device }}.csv
      - name: Upload integration CSV
        uses: actions/upload-artifact@v4
        with:
          name: integration-s1-s2-${{ matrix.device }}.csv
          path: ${{ env.RESULTS_DIR }}/integration-s1-s2-${{ matrix.device }}.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ─────────────────────────────────────────────────────────────────
  # S3 — MusicXML Layout (Capa 1B) — dispatch manual
  # Requiere emscripten (build propio de Verovio) y, para la paridad
  # visual, un Verovio nativo compilado. Ninguno de los dos se instala
  # en el camino por defecto, así que estos jobs no se disparan solos.
  # ─────────────────────────────────────────────────────────────────
  s3-verovio-build:
    name: S3 Verovio WASM Custom Build
    if: "github.event_name == 'workflow_dispatch' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S3')"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: mymindstorm/setup-emscripten@v1.4
        with:
          version: '3.1.50'
      - name: Build Verovio WASM (módulos mínimos)
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          ./build_verovio_wasm.sh --modules musicxml,layout,transpose,mei --output ./wasm/
      - name: Verify WASM size (< 3 MB gzipped)
        # El build usa SINGLE_FILE=1: el wasm va embebido en verovio.js y no
        # existe verovio.wasm. Medir el fichero equivocado hacía fallar el
        # step por gzip: file not found.
        run: |
          gzip -c ${{ env.SPIKE_ROOT }}/musicxml-layout/wasm/verovio.js | wc -c
          # Debe ser < 3_145_728 bytes
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verovio-wasm
          path: ${{ env.SPIKE_ROOT }}/musicxml-layout/wasm/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s3-pwa-integration:
    name: S3 PWA Integration + Corpus Load
    if: "github.event_name == 'workflow_dispatch' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S3')"
    needs: [plan, s3-verovio-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Verovio WASM
        uses: actions/download-artifact@v4
        with:
          name: verovio-wasm
          path: ${{ env.SPIKE_ROOT }}/musicxml-layout/wasm/
      - name: Install pnpm & deps
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build PWA with Verovio local
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          pnpm build --mode spike
      - name: Run corpus load test (5 partituras)
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          pnpm test:corpus-load --output ${{ env.RESULTS_DIR }}/musicxml-render-initial.json
      - name: Upload render results
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-render-initial.json
          path: ${{ env.RESULTS_DIR }}/musicxml-render-initial.json
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s3-perf:
    name: S3 Performance Benchmarks
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S3')"
    needs: [plan, s3-pwa-integration]
    runs-on: [spike-ios, spike-android, spike-windows]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [ios, android, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download Verovio WASM
        uses: actions/download-artifact@v4
        with:
          name: verovio-wasm
          path: ${{ env.SPIKE_ROOT }}/musicxml-layout/wasm/
      - name: Run perf benchmarks (first paint, reflow, transpose)
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          pnpm test:perf --device ${{ matrix.device }} --iterations 100 --output ${{ env.RESULTS_DIR }}/musicxml-perf-${{ matrix.device }}.csv
      - name: Upload perf CSV
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-perf-${{ matrix.device }}.csv
          path: ${{ env.RESULTS_DIR }}/musicxml-perf-${{ matrix.device }}.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s3-visual-parity:
    name: S3 Visual Parity vs PDF
    if: "github.event_name == 'workflow_dispatch' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S3')"
    needs: [plan, s3-pwa-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download Verovio WASM
        uses: actions/download-artifact@v4
        with:
          name: verovio-wasm
          path: ${{ env.SPIKE_ROOT }}/musicxml-layout/wasm/
      - name: Generate reference PDFs (MuseScore headless)
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          ./generate_reference_pdfs.sh --output ./ref-pdfs/
      - name: Run pixel-diff (ImageMagick / pixelmatch)
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          pnpm test:visual-parity --ref ./ref-pdfs --threshold 0.02 --output ${{ env.RESULTS_DIR }}/musicxml-visual-parity.csv
      - name: Upload visual parity CSV + diff screenshots
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-visual-parity
          path: |
            ${{ env.RESULTS_DIR }}/musicxml-visual-parity.csv
            ${{ env.RESULTS_DIR }}/visual-diffs/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  s3-stress:
    name: S3 Stress Test (50 páginas)
    if: "needs.plan.outputs.hardware == 'true' && (needs.plan.outputs.spike == 'all' || needs.plan.outputs.spike == 'S3')"
    needs: [plan, s3-pwa-integration]
    runs-on: spike-ios  # iPad 8th gen es el baseline de memoria
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Verovio WASM
        uses: actions/download-artifact@v4
        with:
          name: verovio-wasm
          path: ${{ env.SPIKE_ROOT }}/musicxml-layout/wasm/
      - name: Run 50-page stress test
        run: |
          cd ${{ env.SPIKE_ROOT }}/musicxml-layout
          pnpm test:stress --pages 50 --output ${{ env.RESULTS_DIR }}/musicxml-stress-50pages.csv
      - name: Upload stress CSV
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-stress-50pages.csv
          path: ${{ env.RESULTS_DIR }}/musicxml-stress-50pages.csv
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ─────────────────────────────────────────────────────────────────
  # Consolidated Report (Gate G2)
  # Corre SIEMPRE que la selección sea 'all', también en push/PR, y
  # aunque los jobs de los que depende se hayan saltado o fallado:
  # `always()` lo desacopla y el generador ya marca PENDING lo que no
  # tiene medidas (no lo convierte en PASS).
  # ─────────────────────────────────────────────────────────────────
  spike-report:
    name: Spike Consolidated Report (Gate G2)
    if: "always() && needs.plan.outputs.spike == 'all'"
    needs: [plan, s1-config-doc, s2-heartbeat, s2-failover, s2-integration, s3-pwa-integration, s3-visual-parity, s3-stress]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download all results
        uses: actions/download-artifact@v4
        continue-on-error: true  # sin artefactos (nada corrió) el informe es PENDING, no un error
        with:
          path: ${{ env.RESULTS_DIR }}/
      - name: Generate consolidated report
        run: |
          cd ${{ env.SPIKE_ROOT }}
          ./generate_report.sh --results ${{ env.RESULTS_DIR }} --output ${{ env.RESULTS_DIR }}/spike-consolidated-report.md
      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: spike-consolidated-report.md
          path: ${{ env.RESULTS_DIR }}/spike-consolidated-report.md
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - name: Comment on PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('${{ env.RESULTS_DIR }}/spike-consolidated-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: report.substring(0, 65535)
            });

  # ─────────────────────────────────────────────────────────────────
  # Hardware Provisioning (manual dispatch)
  # ─────────────────────────────────────────────────────────────────
  provision-hardware:
    name: Provision Test Hardware
    if: "github.event_name == 'workflow_dispatch' && github.event.inputs.provision == 'true'"
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Ansible playbook for hardware setup
        run: |
          cd ${{ env.SPIKE_ROOT }}/hardware
          ansible-playbook -i inventory.yml provision.yml --ask-vault-pass
