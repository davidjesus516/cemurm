name: PR size

# The agent guards catch `gh pr create` inside a session. This catches the PR,
# whatever opened it: the web UI, a human, or an agent whose runtime has no
# plugin loaded. Same metric (authored lines, generated artifacts excluded),
# same rules module (scripts/hooks/rules.mjs).
#
# A violation fails the `authored-lines` job with a non-zero exit by design
# (odd/tasks/agent-guards.md:52). The job is not in the `checks` ruleset, so a
# red result does not block a merge; adding it there is a repository-setting
# decision, not a code change.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  authored-lines:
    name: authored-lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `pnpm install`: the check only reads git and the rules module, so it
      # stays the cheapest job in the suite.
      - run: node scripts/check-pr-size.mjs --base "${{ github.event.pull_request.base.sha }}" --head HEAD
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      # A native stack shows only its own layer per PR. This catches a chain
      # rebuilt by hand whose child PRs all target main and carry their
      # ancestors' files (#204-#213, #244). Same policy as the size check above:
      # an inherited-file violation fails the step, while a missing parent ref
      # is reported and skipped (the parent may have been deleted after merge).
      - run: node scripts/check-stack-diff.mjs --base "${{ github.event.pull_request.base.sha }}" --head HEAD
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
