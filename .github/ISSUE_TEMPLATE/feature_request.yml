name: Feature Request
description: Suggest a new feature for CEMURM
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement for CEMURM.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of the problem.
      placeholder: "Ex. I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: checkboxes
    id: beneficiaries
    attributes:
      label: Which users would benefit from this feature?
      options:
        - label: Solo musicians
        - label: Bands
        - label: Music teachers
        - label: Worship leaders
        - label: All users

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or mockups about the feature request here. If referencing an existing app's feature, a link or screenshot is very helpful.
