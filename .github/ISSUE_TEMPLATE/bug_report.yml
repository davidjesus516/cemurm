name: Bug Report
description: Report a bug to help us improve CEMURM
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please fill in as much detail as possible — device and browser matter a lot for a live-performance app.

  - type: textarea
    id: describe-the-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I open Stage mode during a gig, the chord chart scrolls back to the top after each song.
    validations:
      required: true

  - type: textarea
    id: to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the bug happen?
      options:
        - Setlist / repertoire editor
        - Stage mode (live performance)
        - Charts / PDF export
        - Songs library
        - Import / enrichment (Spotify, MusicBrainz, LRCLIB)
        - Offline sync / write queue
        - Auth & collaborators
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: The device you were using when the bug happened.
      placeholder: "e.g. iPhone 14, iPad Pro, Windows PC, MacBook"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. iOS 17, Android 14, Windows 11, macOS Sonoma"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Safari, Chrome, Firefox"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Leave empty if you are unsure.
      placeholder: "e.g. 0.1.0"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem. You can drag and drop images here.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here. If reporting a music notation issue, please attach the ChordPro/text content if possible.
