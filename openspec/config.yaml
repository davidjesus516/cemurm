schema: spec-driven

context: |
  PWA for musicians: repertoires, setlists, live performance, offline-first
  (Vite 6 + React 18 JSX + Tailwind 3 + react-router-dom 7).
  Backend: local Supabase (supabase start, API 127.0.0.1:54321) — NOT a hosted project.
  Schema in supabase/migrations/0001_init.sql through 0033_feedback.sql, 33 files, no gap.
  Product source of truth: features/*.feature (45 Gherkin files), docs/database-schema-v2.md.
  Package manager: pnpm v11 (lockfile pnpm-lock.yaml; never npm install).
  Tests, typecheck and CI all exist and are runnable. Do not synthesize a runner.

# Preserved explicit value. A runner EXISTS (`pnpm test`); this is not a no-runner fallback.
# TDD here is CONDITIONAL per AGENTS.md: observe RED only when a relevant runnable
# deterministic test and a clear expected outcome exist. Passive documentation work and
# characterization tests have documented exceptions — see AGENTS.md and ADR-006.
strict_tdd: false

projects:
  - path: "."
    stack: "Vite 6 + React 18 JSX + Tailwind 3 + @supabase/supabase-js 2.116"
    test_command: "pnpm test"
    test_framework: "vitest"
    coverage_command: ""
    lint_command: "pnpm lint"
    typecheck_command: "pnpm typecheck"
    format_command: ""

testing:
  test_runner: true
  unit: true
  integration: false
  e2e: false
  coverage: false
  notes: >
    Vitest run in the node environment; no jsdom and no testing-library, so there are no
    DOM component tests. Tests are colocated as <module>.test.js beside the module under
    test, and they guard the domain layer (src/domain/**) plus src/integrations/.
    The Gherkin specs under src/test/gherkin/ also run through `pnpm test` — vite.config.js
    has no `test` block, so Vitest's default include collects them without a separate script.
    No coverage package is installed, so coverage stays false and the threshold stays 0.
    Full local verification is: pnpm test && pnpm typecheck && pnpm lint && pnpm build
    plus `pnpm check:visual`. CI does NOT run pnpm typecheck — that is a known, recorded gap,
    not an oversight; see docs/engineering-review-backlog.md.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios; RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - features/*.feature is the product source of truth; delta specs must align with it
    - Name the covering .feature file in a `Coverage:` line, and the originating change in a
      `Created by:` line, so a spec is traceable back to its work unit
  design:
    - "Follow docs/technical-spec.md and the real src/ layout — app/ (entrypoint, router,
      shell), features/<feature>/, domain/ (pure, no I/O), data/repositories/ (impure),
      integrations/, offline/, ui/patterns/, hooks/, lib/ (storage.js only), test/"
    - There is no src/components/, src/pages/, src/store/ or src/utils/ — the tree was relocated
    - JSX, not TSX; Tailwind only (no CSS modules, styled-components, or inline styles)
    - Colours live in tailwind.config.js as the cem.* scale. That file is what
      bash scripts/check-visual-contract.sh reads; assets/tokens.css in the visual skill is an
      unadopted proposal and is NOT enforced by the gate
  tasks:
    - Group by phase, hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Conventional Commits; feature branches from main (see AGENTS.md, not CONTRIBUTING.md —
        that file still prescribes npm and a src/store/ layer that do not exist)
      - pnpm only; lint must pass with zero warnings
      - A failing characterization test is fixed in the source, never in the assertion (ADR-006)
    tdd: false
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    visual_command: "pnpm check:visual"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas